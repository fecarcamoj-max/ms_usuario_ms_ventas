spring.application.name=demodesde0
# Crea Definición de las tablas en base a las entidades.
spring.jpa.generate-ddl=true
# Crea las bases de datos en el servidor. "CREA Y BORRA" - update: CREA Y ACTUALIZA.
spring.jpa.hibernate.ddl-auto=create
# url: String de conexion a base de datos + el nombre de la bds.
# jdbc librería para conectar a bds + dependencia del motor de bds en específico.
spring.datasource.url=jdbc:mysql://127.0.0.1:3306/bds_ventas
spring.datasource.username=root
spring.datasource.password=
# driver de Mysql - MariaDB.
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver
# Trace::: Tracking - log -> backend.log....
logging.level.org.springframework.web=trace
logging.level.org.hibernate=trace
logging.level.com=TRACE
logging.file.name=backend.log
# puerto donde se levantará la app spring...
server.port=8182

jwt.secret=404E635266556A586E3272357538782F413F4428472B4B6250645367566B5970
jwt.expiration=86400000

usuario.service.base-url=http://localhost:8181