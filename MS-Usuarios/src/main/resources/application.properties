spring.application.name=demodesde0

# ===============================
# CONEXIÓN A MARIADB
# ===============================
spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:mariadb://127.0.0.1:3306/clase_sabado_persistencia}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:root}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:}
spring.datasource.driver-class-name=org.mariadb.jdbc.Driver

# ===============================
# CONFIGURACIÓN JPA / HIBERNATE
# ===============================
spring.jpa.generate-ddl=true

# update: crea y actualiza las tablas sin borrarlas todas al iniciar.
spring.jpa.hibernate.ddl-auto=update

# Dialecto de MariaDB
spring.jpa.database-platform=org.hibernate.dialect.MariaDBDialect

# ===============================
# LOGS
# ===============================
logging.level.org.springframework.web=TRACE
logging.level.org.hibernate=DEBUG
logging.level.com=TRACE
logging.file.name=backend.log

# ===============================
# SERVIDOR
# ===============================
server.port=8181

jwt.secret=404E635266556A586E3272357538782F413F4428472B4B6250645367566B5970
jwt.expiration=86400000
